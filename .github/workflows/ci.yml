name: CI

on:
  # Branch pushes are covered by their pull request; only main runs on push.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the outdated run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  checks:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pull requests check a prefix of the seeded solver property cases;
      # pushes to main run all of them.
      SOLVER_SEEDED_CASES: ${{ github.event_name == 'pull_request' && '2' || '8' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:run
