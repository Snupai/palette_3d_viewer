# Full planner stack (ADR 0009, issue #49): PostgreSQL, a one-shot migration
# run, the Next.js app and hourly pg_dump backups (issue #38). Works with
# `docker compose` and `podman compose` (rootless too): images are fully qualified and major-pinned, data lives in a
# named volume, and every port is bound to localhost only — never exposed to
# the plant network (LAN access needs HTTPS first, ADR 0008).
#
#   bun run stack:up    # docker compose up -d --build → http://127.0.0.1:3000
#   bun run stack:down  # stops everything; data stays in the volume
#   bun run db:up       # only PostgreSQL, for `bun run dev` + `bun run db:migrate`
#   bun run db:backup   # one extra dump into PALETTE_BACKUP_DIR (default ./backups)
#   bun run db:restore palette-<UTC>.dump --yes   # replaces all data; stop app first
#   docker compose run --rm migrate node admin.mjs init            # first admin
#   docker compose run --rm migrate node admin.mjs reset-password  # recovery
#
# Set CONTAINER_ENGINE=podman for the bun scripts. Credentials match
# DATABASE_URL in .env.example. Change PALETTE_DB_PASSWORD for any shared
# installation. It is also placed verbatim into the services' DATABASE_URL, so
# use URL-safe characters (A-Z a-z 0-9 - . _ ~) — `#`, `@`, `/`, `%` … would
# break the URL and make `migrate` fail (compose cannot percent-encode).
name: palette

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    # Build-time switch (inlined into the client bundle). Defaults to `local`
    # (IndexedDB); store plans in PostgreSQL via the records API with
    #   PALETTE_STORAGE_MODE=server docker compose up -d --build
    NEXT_PUBLIC_PALETTE_STORAGE_MODE: ${PALETTE_STORAGE_MODE:-local}
    NEXT_PUBLIC_DISABLE_AI_FEATURES: ${PALETTE_DISABLE_AI_FEATURES:-}

services:
  db:
    image: docker.io/library/postgres:17
    restart: always
    environment:
      POSTGRES_USER: palette
      POSTGRES_PASSWORD: ${PALETTE_DB_PASSWORD:-palette}
      POSTGRES_DB: palette
    ports:
      - "127.0.0.1:${PALETTE_DB_PORT:-5432}:5432"
    volumes:
      - palette-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palette -d palette"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies drizzle/ migrations, then exits 0. Idempotent: runs on every `up`.
  migrate:
    build:
      <<: *app-build
      target: migrate
    image: localhost/palette-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://palette:${PALETTE_DB_PASSWORD:-palette}@db:5432/palette
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      <<: *app-build
      target: runner
    image: localhost/palette-app:latest
    restart: always
    network_mode: host
    environment:
      DATABASE_URL: postgresql://palette:${PALETTE_DB_PASSWORD:-palette}@127.0.0.1:${PALETTE_DB_PORT:-5432}/palette
      HOSTNAME: "127.0.0.1"
      PORT: "${PALETTE_APP_PORT:-3000}"
      PALETTE_LOGIN_TRUST_PROXY: ${PALETTE_LOGIN_TRUST_PROXY:-false}
      # Sheet-photo import (optional). SHEET_EXTRACTION_API: `ollama` (default)
      # or `openai` (OpenAI-compatible, e.g. llama.cpp `llama-server`). Host
      # networking lets the app reach the model server at 127.0.0.1 directly,
      # e.g. SHEET_EXTRACTION_URL=http://127.0.0.1:8080.
      # Empty values fall back to the app defaults
      # (Ollama :11434 + qwen2.5vl:32b; `openai` :8080 + the server's model —
      # set SHEET_EXTRACTION_MODEL for llama-server in router/multi-model mode).
      # The API key is optional and sent as `Authorization: Bearer`.
      SHEET_EXTRACTION_API: ${SHEET_EXTRACTION_API:-ollama}
      SHEET_EXTRACTION_URL: ${SHEET_EXTRACTION_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      SHEET_EXTRACTION_MODEL: ${SHEET_EXTRACTION_MODEL:-}
      SHEET_EXTRACTION_API_KEY: ${SHEET_EXTRACTION_API_KEY:-}
      SHEET_EXTRACTION_MAX_CONCURRENT: ${SHEET_EXTRACTION_MAX_CONCURRENT:-1}
    healthcheck:
      test: ["CMD", "node", "/opt/palette/healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/container-healthcheck.cjs:/opt/palette/healthcheck.cjs:ro
  # Hourly `pg_dump -Fc` into PALETTE_BACKUP_DIR (issue #38, ADR 0009) — put
  # that directory on a separate disk. Keeps PALETTE_BACKUP_RETENTION_DAYS (7)
  # days. Same image as db, so pg_dump matches the server version. Logic and
  # the restore command: scripts/pg-backup.sh, README "Backups and restore".
  backup:
    image: docker.io/library/postgres:17
    restart: always
    entrypoint: ["sh", "/opt/palette/pg-backup.sh"]
    command: ["loop"]
    # Owner of the dump files. Default root is your own user under rootless
    # Podman; with Docker on Linux set e.g. PALETTE_BACKUP_USER=1000:1000.
    user: "${PALETTE_BACKUP_USER:-0:0}"
    environment:
      PGHOST: db
      PGUSER: palette
      PGPASSWORD: ${PALETTE_DB_PASSWORD:-palette}
      PGDATABASE: palette
      PALETTE_BACKUP_DIR: /backups
      PALETTE_BACKUP_INTERVAL_SECONDS: ${PALETTE_BACKUP_INTERVAL_SECONDS:-3600}
      PALETTE_BACKUP_RETENTION_DAYS: ${PALETTE_BACKUP_RETENTION_DAYS:-7}
    volumes:
      # :z relabels for SELinux hosts (Podman on Fedora/RHEL); ignored elsewhere.
      - ${PALETTE_BACKUP_DIR:-./backups}:/backups:z
      - ./scripts/pg-backup.sh:/opt/palette/pg-backup.sh:ro,z
    healthcheck:
      test: ["CMD", "sh", "/opt/palette/pg-backup.sh", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

volumes:
  palette-db:
